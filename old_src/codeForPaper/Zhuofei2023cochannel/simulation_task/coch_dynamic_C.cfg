%% simulation parameters
[simulation.DurationSeconds]	    120
[simulation.RadioAccessMode]	        COEX-STD-INTERF-5G
[scenario.Type]	    ETSI-Highway
[roadLength]	        8000
[roadWidth]	            4
[vMean]                 120
[vStDev]                12
[NLanes]                3

%% coexistence mitigation method
[coexistence.Method]	        C
[coexistence.Superframe.DurationSeconds]	    0.025
[coexistence.Superframe.SidelinkPortionEndSeconds]	        0.013
[coexistence.Superframe.SlotAllocationMode]	dynamic


%% packet generation
[averageTbeacon]        0.1
[congestionControl.Enabled]            false
[application.PacketGeneration.IntervalVariationSeconds] 0


%% PHY layer
% channel model
[channel.PathLoss.Model]          3
[channel.PathLoss.ReferenceLossAtOneMeterDb]                 47.85
[channel.PathLoss.Exponent1]                  2
[channel.PathLoss.BreakpointDistance1Meters]          128
[channel.PathLoss.Exponent2]                 2.8
[channel.PathLoss.BreakpointDistance2Meters]          512
[channel.PathLoss.Exponent3]                 3.3

[radio.ReceiverNoiseFigureDb]	                6
[channel.PacketErrorRateCurveDirectory]
[ieee80211p.RelativeInterferenceLevelModelEnabled]	        true
[ieee80211p.Mcs]               2
[lteV2x.Mcs]               7
[nrV2x.Mcs]                8
[resourcePool.SubchannelSizeResourceBlocks]        12
[resourcePool.PartialFrequencyOverlapEnabled]	    true
[resourceAllocation.Algorithm]           18
[radio.FixedPowerDensityEnabled]		    false

[lteV2x.AdjacentPscchAndPsschEnabled]            true
[nrV2x.SubcarrierSpacingKilohertz]                30  % Sets the SCS for 5G (kHz)
[nrV2x.DmrsResourceElementCountPerSlot]              18  % Sets the number of DMRS resource element used in each slot
[nrV2x.SciSymbolCount]            3   % Sets the number of symbols dedicated to the SCI-1 between 2 and 3
[nrV2x.SciResourceBlockCount]               12  % Sets the number of RBs dedicated to the SCI-1
[resourceAllocation.Autonomous.KeepResourceProbability]	        0.5


%% output
[output.PacketReceptionRatio.Enabled] true
[output.PacketReceptionRatio.DistanceBinWidthMeters]         50
[output.ChannelBusyRatio.Enabled]              true

