# Hook-backed output-artifact configuration.
SchemaVersion = 1

[Simulation]
RandomSeed = 15
DurationSeconds = 0.6

[Scenario]
Type = "BidirectionalHighway"
UpdateIntervalSeconds = 0.1

[Scenario.BidirectionalHighway]
RandomSeed = 105
VehicleCount = 8
NLanes = 2
LaneWidth = 4
RoadLength = 300
CentralDividerWidth = 0
MeanVehicleSpeed = 18
VehicleSpeedStandardDeviation = 2
RerollSpeedOnWrapAround = false

[Application]
PacketSizeBytes = 190
ResourceReservationIntervalSeconds = 0.1

[Application.PacketGeneration]
IntervalSeconds = 0.1
IntervalVariationSeconds = 0
RandomComponentMeanSeconds = 0

[Application.ChannelLoad]
Enabled = true

[Application.CongestionControl]
Enabled = false

[Radio]
Type = "LteV2X"
BandwidthMHz = 10
TransmitPowerDbm = 23
FixedPowerDensityEnabled = false
ReceiverNoiseFigureDb = 6

[Radio.LteV2X]
Mcs = 7
AdjacentPscchAndPsschEnabled = true

[Radio.Sidelink.ResourcePool]
SubchannelSizeResourceBlocks = 10
PartialFrequencyOverlapEnabled = false

[Awareness]
RangesMeters = [150]

[ResourceAllocation]
Type = "MaximumReuseDistance"
RandomSeed = 205

[ResourceAllocation.MaximumReuseDistance]
ReassignmentIntervalSeconds = 0.1

[Outputs.VehicleKinematics]
Enabled = true

[Outputs.AverageNeighborCount]
Enabled = true

[Outputs.PacketReceptionRatio]
Enabled = true
DistanceBinWidthMeters = 25

[Outputs.UpdateDelay]
Enabled = true

[Outputs.PacketDelay]
Enabled = true

[Outputs.DataAge]
Enabled = true

[Outputs.WirelessBlindSpot]
Enabled = true

[Outputs.ChannelBusyRatio]
Enabled = true

[Outputs.ControllerDiagnostics]
Enabled = true
TopK = 3
RankDisplacementEnabled = false
FlushRowCount = 500

[Outputs.PacketFateTrace]
Enabled = true
FlushRowCount = 500
FileFormat = "csv"
