# Short NR-V2X Mode 1 campaign over the 3GPP freeway traffic presets.
SchemaVersion = 1

[Simulation]
RandomSeed = 18
DurationSeconds = 0.3

[Scenario]
Type = "EtsiHighway"
UpdateIntervalSeconds = 0.1

[Scenario.EtsiHighway]
RandomSeed = 108
TrafficModel = "HighSpeedLowDensity"
Placement = "Uniform"
MinimumRoadLength = 2000

[Application]
PacketSizeBytes = 190
ResourceReservationIntervalSeconds = 0.1

[Application.PacketGeneration]
IntervalSeconds = 0.1
IntervalVariationSeconds = 0
RandomComponentMeanSeconds = 0

[Application.CongestionControl]
Enabled = false

[Radio]
Type = "NrV2X"
BandwidthMHz = 10
TransmitPowerDbm = 23
FixedPowerDensityEnabled = false
TransmitAntennaGainDb = 3
ReceiveAntennaGainDb = 3
ReceiverNoiseFigureDb = 6

[Radio.NrV2X]
SubcarrierSpacingKilohertz = 15
DmrsResourceElementCountPerSlot = 24
Mcs = 7

[Radio.Sidelink.ResourcePool]
SubchannelSizeResourceBlocks = 10
PartialFrequencyOverlapEnabled = false

[Awareness]
RangesMeters = [100, 300]

[ResourceAllocation]
Type = "MaximumReuseDistance"
RandomSeed = 208

[ResourceAllocation.MaximumReuseDistance]
ReassignmentIntervalSeconds = 0.1

[Outputs.PacketReceptionRatio]
Enabled = true
DistanceBinWidthMeters = 25
