# Independent traffic-randomness configuration.
SchemaVersion = 1

[Simulation]
RandomSeed = 12
DurationSeconds = 0.5

[Scenario]
Type = "BidirectionalHighway"
UpdateIntervalSeconds = 0.1

[Scenario.BidirectionalHighway]
RandomSeed = 102
VehicleCount = 6
NLanes = 2
LaneWidth = 4
RoadLength = 300
CentralDividerWidth = 0
