[Radio.LteV2X]
Mcs = 7
AdjacentPscchAndPsschEnabled = true

[Radio.Sidelink.ResourcePool]
SubchannelSizeResourceBlocks = 10
PartialFrequencyOverlapEnabled = false

[Awareness]
RangesMeters = [150]

[ResourceAllocation]
Type = "Random"
RandomSeed = 202

[ResourceAllocation.Random]

[Outputs.VehicleKinematics]
Enabled = true
