%% deterministic LTE/IEEE 802.11p coexistence comparison
[simulation.RequiredVersion]                 V7
[simulation.DurationSeconds]                 3
[simulation.RadioAccessMode]                 COEX-NO-INTERF

%% scenario
[scenario.Type]                              BidirectionalHighwayScenario
[scenarioOptions.VehicleCount]               48
[scenarioOptions.NLanes]                     3
[scenarioOptions.LaneWidth]                  4
[scenarioOptions.RoadLength]                 1000
[scenarioOptions.CentralDividerWidth]        0
[scenarioOptions.MeanVehicleSpeed]           33.3333333333333
[scenarioOptions.VehicleSpeedStandardDeviation] 3.33333333333333
[scenarioOptions.RerollSpeedOnWrapAround]    false

%% balanced technology population
[coexistence.VehiclePattern.SidelinkVehicleCount] 24
[coexistence.VehiclePattern.ItsG5VehicleCount]    24

%% periodic traffic
[application.PacketSizeBytes]                190
[application.ResourceReservationIntervalSeconds] 0.1
[application.PacketGeneration.IntervalSeconds] 0.1
[application.PacketGeneration.IntervalVariationSeconds] 0
[application.PacketGeneration.RandomComponentMeanSeconds] 0
[congestionControl.Enabled]                  false

%% channel and radio
[channel.PathLoss.Model]                     3
[channel.PathLoss.ReferenceLossAtOneMeterDb] 47.85
[channel.PathLoss.Exponent1]                 2
[channel.PathLoss.BreakpointDistance1Meters] 128
[channel.PathLoss.Exponent2]                 2.8
[channel.PathLoss.BreakpointDistance2Meters] 512
[channel.PathLoss.Exponent3]                 3.3
[channel.PacketErrorRateCurveDirectory]      null
[radio.ReceiverNoiseFigureDb]                6
[radio.FixedPowerDensityEnabled]             false

%% MAC and resource allocation
[ieee80211p.RelativeInterferenceLevelModelEnabled] true
[ieee80211p.Mcs]                             2
[lteV2x.Mcs]                                 7
[lteV2x.AdjacentPscchAndPsschEnabled]        true
[resourcePool.SubchannelSizeResourceBlocks]  -1
[resourcePool.PartialFrequencyOverlapEnabled] true
[resourceAllocation.Type]                    ThreeGppAutonomous
[resourceAllocation.Autonomous.KeepResourceProbability] 0.5

%% output
[awareness.RangesMeters]                     500
[output.PacketReceptionRatio.Enabled]        true
[output.PacketReceptionRatio.DistanceBinWidthMeters] 50
[output.VehicleKinematics.Enabled]           false
[output.UpdateDelay.Enabled]                 false
[output.PacketDelay.Enabled]                 false
[output.DataAge.Enabled]                     false
[output.WirelessBlindSpot.Enabled]           false
[output.AverageNeighborCount.Enabled]        false
[output.ChannelBusyRatio.Enabled]            false
