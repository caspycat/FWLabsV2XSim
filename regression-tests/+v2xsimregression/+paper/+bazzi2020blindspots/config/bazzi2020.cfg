%% Bazzi et al. 2020 wireless-blind-spot baseline
[simulation.RequiredVersion]                 V7
[simulation.RadioAccessMode]                 LTE-V2X
[simulation.DurationSeconds]                 30

%% Periodic bidirectional highway; profile dimensions are runner overrides
[scenario.Type]                              BidirectionalHighwayScenario
[scenario.UpdateIntervalSeconds]             0.1
[scenarioOptions.VehicleCount]               100
[scenarioOptions.NLanes]                     3
[scenarioOptions.LaneWidth]                  4
[scenarioOptions.RoadLength]                 1000
[scenarioOptions.CentralDividerWidth]        0
[scenarioOptions.MeanVehicleSpeed]           38.8888888888889
[scenarioOptions.VehicleSpeedStandardDeviation] 0
[scenarioOptions.RerollSpeedOnWrapAround]    false

%% 300-byte periodic beacons at 10 Hz
[application.PacketSizeBytes]                300
[application.ResourceReservationIntervalSeconds] 0.1
[application.PacketGeneration.IntervalSeconds] 0.1
[application.PacketGeneration.IntervalVariationSeconds] 0
[application.PacketGeneration.RandomComponentMeanSeconds] 0
[congestionControl.Enabled]                  false
[channelLoad.Enabled]                        true
[channelLoad.MeasurementWindowSeconds]       0.1
[channelLoad.UpdateStepsPerWindow]            100

%% LTE-V2X PHY and correlated WINNER+ B1 shadowing
[radio.BandwidthMHz]                         10
[radio.TransmitPowerDbm]                     23
[radio.FixedPowerDensityEnabled]             false
[radio.TransmitAntennaGainDb]                3
[radio.ReceiveAntennaGainDb]                 3
[radio.ReceiverNoiseFigureDb]                9
[channel.PacketErrorRateCurveDirectory]      null
[channel.PathLoss.Model]                     0
[channel.RayleighFadingEnabled]              false
[channel.Shadowing.LosStandardDeviationDb]   3
[channel.Shadowing.NlosStandardDeviationDb]  4
[lteV2x.Mcs]                                 6
[lteV2x.AdjacentPscchAndPsschEnabled]        true
[sidelink.Harq.MaximumTransmissionCount]     1
[sidelink.LosPacketDecodeSinrThresholdDb]    5.79

%% 3GPP autonomous allocation
[resourcePool.SubchannelSizeResourceBlocks]  10
[resourcePool.PartialFrequencyOverlapEnabled] false
[resourceAllocation.Type]                    ThreeGppAutonomous
[resourceAllocation.Autonomous.ReselectionCounterMinimum] 5
[resourceAllocation.Autonomous.ReselectionCounterMaximum] 15
[resourceAllocation.Autonomous.KeepResourceProbability] 0.8

%% Count-preserving PRR and wireless-blind-spot outputs
[awareness.RangesMeters]                     100,300
[output.PacketReceptionRatio.Enabled]        true
[output.PacketReceptionRatio.DistanceBinWidthMeters] 10
[output.WirelessBlindSpot.Enabled]           true
[output.WirelessBlindSpot.MaximumDelaySeconds] 15
[output.WirelessBlindSpot.BinWidthSeconds]   0.1
[output.AverageNeighborCount.Enabled]         false
[output.UpdateDelay.Enabled]                 false
[output.PacketDelay.Enabled]                 false
[output.DataAge.Enabled]                     false
[output.ChannelBusyRatio.Enabled]            false
